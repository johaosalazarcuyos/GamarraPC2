name: CodeQL (SAST)

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    name: Análisis estático de código (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3
